<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feedback</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:#fff7ed;color:#1f2937;display:flex;justify-content:center;padding:16px}
.card{background:#fff;max-width:420px;width:100%;border-radius:16px;padding:24px;box-shadow:0 4px 16px rgba(0,0,0,.08)}
h1{font-size:22px;margin:0 0 6px;text-align:center}
p{text-align:center;color:#6b7280}
.stars{display:flex;justify-content:center;gap:6px;direction:ltr;margin:16px 0}
.star{font-size:44px;color:#d1d5db;background:none;border:none;padding:0}
.star.on{color:#f59e0b}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0;justify-content:center}
.chip{padding:8px 14px;border:1px solid #d1d5db;border-radius:20px;background:#fff;font-size:15px}
.chip.on{background:#ea580c;color:#fff;border-color:#ea580c}
textarea,input{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px;font-size:16px;margin-top:10px;font-family:inherit}
.btn{display:block;width:100%;padding:14px;border:none;border-radius:10px;background:#ea580c;color:#fff;font-size:17px;margin-top:14px;text-align:center;text-decoration:none}
.hidden{display:none}
.lang{background:none;border:none;color:#6b7280;font-size:14px}
</style>
</head>
<body>
<div class="card">
  <button class="lang" id="lang"></button>
  <h1 id="title"></h1>
  <p id="sub"></p>
  <div class="stars" id="stars"></div>

  <div id="low" class="hidden">
    <p id="sorry"></p>
    <div class="chips" id="chips"></div>
    <textarea id="comment" rows="3"></textarea>
    <input id="contact">
    <button class="btn" id="send"></button>
  </div>

  <div id="high" class="hidden">
    <p id="thanks"></p>
    <textarea id="comment2" rows="2"></textarea>
    <a class="btn" id="google" target="_blank"></a>
    <button class="btn" id="send2" style="background:#6b7280"></button>
  </div>

  <div id="done" class="hidden">
    <h1>✅</h1>
    <p id="doneMsg"></p>
  </div>
</div>

<script>
const GOOGLE_URL = "https://www.google.com/maps"; // نبدلها لاحقاً برابط تقييم فرعك
const T = {
  ar: {
    dir: "rtl", lang: "English",
    title: "كيف كانت تجربتك؟", sub: "قيّمنا في ثواني",
    sorry: "نعتذر منك. ساعدنا نصلّح الموضوع:",
    cats: {food:"الأكل", service:"الخدمة", cleanliness:"النظافة", speed:"السرعة", other:"أخرى"},
    comment: "اكتب ملاحظتك (اختياري)",
    contact: "جوالك أو إيميلك لو تبغانا نتواصل معك (اختياري)",
    send: "إرسال", thanks: "يسعدنا إنك استمتعت! 🎉",
    google: "قيّمنا في قوقل", done: "شكراً لك، وصلتنا ملاحظتك."
  },
  en: {
    dir: "ltr", lang: "العربية",
    title: "How was your experience?", sub: "Rate us in a few seconds",
    sorry: "We're sorry. Help us fix it:",
    cats: {food:"Food", service:"Service", cleanliness:"Cleanliness", speed:"Speed", other:"Other"},
    comment: "Write your note (optional)",
    contact: "Phone or email if you'd like us to follow up (optional)",
    send: "Send", thanks: "Glad you enjoyed it! 🎉",
    google: "Review us on Google", done: "Thank you, we got your feedback."
  }
};
let lang = "ar", rating = 0, cat = "";
const $ = id => document.getElementById(id);

function render() {
  const t = T[lang];
  document.documentElement.dir = t.dir;
  document.documentElement.lang = lang;
  $("lang").textContent = t.lang;
  $("title").textContent = t.title;
  $("sub").textContent = t.sub;
  $("sorry").textContent = t.sorry;
  $("comment").placeholder = t.comment;
  $("comment2").placeholder = t.comment;
  $("contact").placeholder = t.contact;
  $("send").textContent = t.send;
  $("send2").textContent = t.send;
  $("thanks").textContent = t.thanks;
  $("google").textContent = t.google;
  $("google").href = GOOGLE_URL;
  $("doneMsg").textContent = t.done;

  $("stars").innerHTML = "";
  for (let i = 1; i <= 5; i++) {
    const b = document.createElement("button");
    b.className = "star" + (i <= rating ? " on" : "");
    b.textContent = "★";
    b.onclick = () => { rating = i; render(); };
    $("stars").appendChild(b);
  }

  $("chips").innerHTML = "";
  for (const k in t.cats) {
    const c = document.createElement("button");
    c.className = "chip" + (cat === k ? " on" : "");
    c.textContent = t.cats[k];
    c.onclick = () => { cat = k; render(); };
    $("chips").appendChild(c);
  }

  $("low").classList.toggle("hidden", !(rating >= 1 && rating <= 3));
  $("high").classList.toggle("hidden", !(rating >= 4));
}

function submit() {
  const data = {
    rating: rating,
    category: cat,
    comment: $("comment").value || $("comment2").value,
    contact: $("contact").value,
    created_at: new Date().toISOString()
  };
  console.log("Feedback:", data); // الخطوة الجاية: نربطه بقاعدة بيانات
  $("low").classList.add("hidden");
  $("high").classList.add("hidden");
  $("stars").classList.add("hidden");
  $("title").classList.add("hidden");
  $("sub").classList.add("hidden");
  $("done").classList.remove("hidden");
}

$("send").onclick = submit;
$("send2").onclick = submit;
$("lang").onclick = () => { lang = lang === "ar" ? "en" : "ar"; render(); };
render();
</script>
</body>
</html>
